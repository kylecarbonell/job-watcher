name: Watch New-Grad-Positions

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run watcher
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_PM_WEBHOOK_URL: ${{ secrets.SLACK_PM_WEBHOOK_URL }}
        run: python3 scripts/watch_new_grad.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/new-grad-seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen new-grad listings"
            for attempt in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push && break
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
          fi
