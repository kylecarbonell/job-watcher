name: Test webhooks

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Ping Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"text": "✅ Test ping from job-watcher — Slack webhook is wired up correctly."}' \
            "$SLACK_WEBHOOK_URL"

      - name: Report missing secret
        if: ${{ env.SLACK_WEBHOOK_URL == '' }}
        run: |
          echo "::error::SLACK_WEBHOOK_URL is not set as a repo secret."
          exit 1
